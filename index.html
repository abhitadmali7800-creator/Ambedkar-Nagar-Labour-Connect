<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>UP Service Hub - Admin Panel</title>
  <link rel="icon" type="image/jpeg" href="logo.jpeg">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f5f7fb;
      color: #222;
    }

    .header {
      background: #111827;
      color: white;
      padding: 18px 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .header h1 {
      font-size: 22px;
    }

    .header span {
      font-size: 14px;
      opacity: 0.8;
    }

    .container {
      max-width: 1200px;
      margin: 25px auto;
      padding: 0 15px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      gap: 10px;
      flex-wrap: wrap;
    }

    .topbar h2 {
      font-size: 24px;
    }

    #refreshBtn {
      border: none;
      background: #2563eb;
      color: white;
      padding: 11px 18px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    .booking-card {
      background: white;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 18px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
      border-left: 5px solid #f59e0b;
    }

    .booking-card.confirmed {
      border-left-color: #16a34a;
    }

    .booking-card.rejected {
      border-left-color: #dc2626;
    }

    .booking-header {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: center;
      margin-bottom: 15px;
      flex-wrap: wrap;
    }

    .booking-header h3 {
      font-size: 19px;
    }

    .status {
      padding: 6px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
      background: #fef3c7;
      color: #92400e;
    }

    .status.confirmed {
      background: #dcfce7;
      color: #166534;
    }

    .status.rejected {
      background: #fee2e2;
      color: #991b1b;
    }

    .details {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 12px;
      margin-bottom: 18px;
    }

    .detail {
      background: #f8fafc;
      padding: 11px;
      border-radius: 8px;
    }

    .detail strong {
      display: block;
      font-size: 12px;
      color: #64748b;
      margin-bottom: 4px;
    }

    .detail span {
      font-size: 14px;
      word-break: break-word;
    }

    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
    }

    button {
      border: none;
      cursor: pointer;
      border-radius: 7px;
      padding: 10px 14px;
      font-weight: bold;
    }

    .accept-btn {
      background: #16a34a;
      color: white;
    }

    .reject-btn {
      background: #dc2626;
      color: white;
    }

    .send-btn {
      background: #2563eb;
      color: white;
    }

    .worker-select {
      min-width: 220px;
      padding: 10px;
      border: 1px solid #cbd5e1;
      border-radius: 7px;
      background: white;
    }

    .empty {
      background: white;
      padding: 40px;
      text-align: center;
      border-radius: 12px;
      color: #64748b;
    }

    .loading {
      text-align: center;
      padding: 30px;
    }

    .message {
      position: fixed;
      bottom: 20px;
      right: 20px;
      padding: 14px 18px;
      border-radius: 8px;
      color: white;
      display: none;
      z-index: 1000;
    }

    .message.success {
      background: #16a34a;
    }

    .message.error {
      background: #dc2626;
    }

    @media(max-width:600px) {
      .header {
        padding: 15px;
      }

      .header h1 {
        font-size: 18px;
      }

      .container {
        margin-top: 15px;
      }
    }
  </style>
</head>

<body>

  <header class="header">
    <h1>UP Service Hub</h1>
    <span>Admin Panel</span>
  </header>

  <main class="container">

    <div class="topbar">
      <h2>📋 Bookings</h2>
      <button id="refreshBtn">🔄 Refresh</button>
    </div>

    <div id="bookingsContainer">
      <div class="loading">
        Booking load हो रही हैं...
      </div>
    </div>

  </main>

  <div id="message" class="message"></div>


  <!-- Firebase -->
  <script type="module">

    import {
      initializeApp
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

    import {
      getFirestore,
      collection,
      getDocs,
      doc,
      updateDoc,
      orderBy,
      query,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


    // ============================================
    // 🔥 अपने Firebase Config को यहाँ लगाओ
    // ============================================

    const firebaseConfig = {

      apiKey: "YOUR_API_KEY",

      authDomain:
        "ambedkar-nagar-labour-connet.firebaseapp.com",

      projectId:
        "ambedkar-nagar-labour-connet",

      storageBucket:
        "ambedkar-nagar-labour-connet.firebasestorage.app",

      messagingSenderId:
        "413646541836",

      appId:
        "YOUR_APP_ID",

      measurementId:
        "YOUR_MEASUREMENT_ID"

    };


    // Firebase Start
    const app = initializeApp(firebaseConfig);

    const db = getFirestore(app);


    // ============================================
    // ELEMENTS
    // ============================================

    const bookingsContainer =
      document.getElementById("bookingsContainer");

    const refreshBtn =
      document.getElementById("refreshBtn");

    const messageBox =
      document.getElementById("message");


    // ============================================
    // MESSAGE
    // ============================================

    function showMessage(text, type = "success") {

      messageBox.textContent = text;

      messageBox.className =
        "message " + type;

      messageBox.style.display = "block";

      setTimeout(() => {

        messageBox.style.display = "none";

      }, 3000);
    }


    // ============================================
    // ESCAPE HTML
    // ============================================

    function escapeHTML(value) {

      if (value === null || value === undefined) {
        return "";
      }

      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }


    // ============================================
    // LOAD WORKERS
    // ============================================

    async function loadWorkers() {

      const workersSnapshot =
        await getDocs(collection(db, "workers"));

      const workers = [];

      workersSnapshot.forEach((workerDoc) => {

        const data = workerDoc.data();

        workers.push({

          id: workerDoc.id,

          name: data.name || "नाम नहीं है",

          mobile: data.mobile || "",

          profession: data.profession || "",

          status: data.status || ""

        });

      });

      return workers;
    }


    // ============================================
    // LOAD BOOKINGS
    // ============================================

    async function loadBookings() {

      bookingsContainer.innerHTML = `
        <div class="loading">
          Booking load हो रही हैं...
        </div>
      `;

      try {

        const workers = await loadWorkers();

        const bookingQuery = query(
          collection(db, "bookings"),
          orderBy("createdAt", "desc")
        );

        const snapshot =
          await getDocs(bookingQuery);


        if (snapshot.empty) {

          bookingsContainer.innerHTML = `
            <div class="empty">
              अभी कोई booking नहीं मिली।
            </div>
          `;

          return;
        }


        let html = "";


        snapshot.forEach((bookingDoc) => {

          const booking = bookingDoc.data();

          const bookingId =
            bookingDoc.id;

          const status =
            booking.status || "Pending Admin";


          let statusClass = "";

          if (status === "Confirmed") {
            statusClass = "confirmed";
          }

          if (status === "Rejected") {
            statusClass = "rejected";
          }


          // Worker options
          let workerOptions = `
            <option value="">
              Worker चुनें
            </option>
          `;


          workers.forEach((worker) => {

            workerOptions += `
              <option value="${escapeHTML(worker.id)}">
                ${escapeHTML(worker.name)}
                ${worker.profession
                  ? " - " + escapeHTML(worker.profession)
                  : ""}
              </option>
            `;

          });


          html += `

            <div
              class="booking-card ${statusClass}"
              id="booking-${escapeHTML(bookingId)}"
            >

              <div class="booking-header">

                <h3>
                  👤 ${escapeHTML(
                    booking.customerName || "Customer"
                  )}
                </h3>

                <span class="status ${statusClass}">
                  ${escapeHTML(status)}
                </span>

              </div>


              <div class="details">

                <div class="detail">
                  <strong>Booking ID</strong>
                  <span>${escapeHTML(bookingId)}</span>
                </div>

                <div class="detail">
                  <strong>Customer Name</strong>
                  <span>
                    ${escapeHTML(booking.customerName || "-")}
                  </span>
                </div>

                <div class="detail">
                  <strong>Mobile</strong>
                  <span>
                    ${escapeHTML(booking.customerMobile || "-")}
                  </span>
                </div>

                <div class="detail">
                  <strong>Email</strong>
                  <span>
                    ${escapeHTML(booking.customerEmail || "-")}
                  </span>
                </div>

                <div class="detail">
                  <strong>Service</strong>
                  <span>
                    ${escapeHTML(booking.service || "-")}
                  </span>
                </div>

                <div class="detail">
                  <strong>Work Details</strong>
                  <span>
                    ${escapeHTML(booking.workDetails || "-")}
                  </span>
                </div>

                <div class="detail">
                  <strong>कहाँ जाना है</strong>
                  <span>
                    ${escapeHTML(
                      booking.customerLocation ||
                      booking.customerAddress ||
                      "-"
                    )}
                  </span>
                </div>

                <div class="detail">
                  <strong>Address</strong>
                  <span>
                    ${escapeHTML(
                      booking.customerAddress || "-"
                    )}
                  </span>
                </div>

                <div class="detail">
                  <strong>Booking Date</strong>
                  <span>
                    ${escapeHTML(
                      booking.bookingDate || "-"
                    )}
                  </span>
                </div>

                <div class="detail">
                  <strong>Payment Mode</strong>
                  <span>
                    ${escapeHTML(
                      booking.paymentMode || "-"
                    )}
                  </span>
                </div>

                <div class="detail">
                  <strong>Worker Status</strong>
                  <span>
                    ${escapeHTML(
                      booking.workerStatus || "-"
                    )}
                  </span>
                </div>

                <div class="detail">
                  <strong>Assigned Worker</strong>
                  <span>
                    ${escapeHTML(
                      booking.assignedWorkerName || "अभी नहीं"
                    )}
                  </span>
                </div>

              </div>


              <div class="actions">

                ${
                  status === "Pending Admin"
                  ? `
                    <button
                      class="accept-btn"
                      onclick="acceptBooking('${bookingId}')"
                    >
                      ✅ Accept Booking
                    </button>

                    <button
                      class="reject-btn"
                      onclick="rejectBooking('${bookingId}')"
                    >
                      ❌ Reject
                    </button>
                  `
                  : ""
                }


                ${
                  status === "Confirmed"
                  ? `

                    <select
                      class="worker-select"
                      id="worker-${bookingId}"
                    >
                      ${workerOptions}
                    </select>

                    <button
                      class="send-btn"
                      onclick="sendToWorker('${bookingId}')"
                    >
                      📤 Worker को भेजें
                    </button>

                  `
                  : ""
                }

              </div>

            </div>

          `;

        });


        bookingsContainer.innerHTML = html;


      } catch (error) {

        console.error(error);

        bookingsContainer.innerHTML = `
          <div class="empty">
            Booking load नहीं हो सकी।<br><br>
            <small>${escapeHTML(error.message)}</small>
          </div>
        `;

      }

    }


    // ============================================
    // ACCEPT BOOKING
    // ============================================

    window.acceptBooking = async function(bookingId) {

      const confirmAccept =
        confirm(
          "क्या आप इस booking को Accept करना चाहते हैं?"
        );

      if (!confirmAccept) {
        return;
      }


      try {

        const bookingRef =
          doc(db, "bookings", bookingId);


        await updateDoc(
          bookingRef,
          {

            status: "Confirmed",

            adminStatus: "Accepted",

            workStatus: "Waiting",

            updatedAt: serverTimestamp()

          }
        );


        showMessage(
          "✅ Booking Accept हो गई!"
        );


        loadBookings();


      } catch (error) {

        console.error(error);

        showMessage(
          "Booking Accept नहीं हुई: " +
          error.message,
          "error"
        );

      }

    };


    // ============================================
    // REJECT BOOKING
    // ============================================

    window.rejectBooking = async function(bookingId) {

      const confirmReject =
        confirm(
          "क्या आप इस booking को Reject करना चाहते हैं?"
        );

      if (!confirmReject) {
        return;
      }


      try {

        const bookingRef =
          doc(db, "bookings", bookingId);


        await updateDoc(
          bookingRef,
          {

            status: "Rejected",

            adminStatus: "Rejected",

            workStatus: "Rejected",

            updatedAt: serverTimestamp()

          }
        );


        showMessage(
          "❌ Booking Reject हो गई!"
        );


        loadBookings();


      } catch (error) {

        console.error(error);

        showMessage(
          "Booking Reject नहीं हुई: " +
          error.message,
          "error"
        );

      }

    };


    // ============================================
    // SEND BOOKING TO WORKER
    // ============================================

    window.sendToWorker = async function(bookingId) {

      const select =
        document.getElementById(
          "worker-" + bookingId
        );


      const workerId =
        select.value;


      if (!workerId) {

        alert(
          "पहले Worker चुनिए।"
        );

        return;

      }


      const selectedText =
        select.options[
          select.selectedIndex
        ].text;


      const confirmSend =
        confirm(
          "क्या यह booking इस Worker को भेजनी है?\n\n" +
          selectedText
        );


      if (!confirmSend) {
        return;
      }


      try {

        // Worker document
        const workerRef =
          doc(db, "workers", workerId);


        // Booking document
        const bookingRef =
          doc(db, "bookings", bookingId);


        // Worker का data लेना
        const workersSnapshot =
          await getDocs(collection(db, "workers"));


        let selectedWorker = null;


        workersSnapshot.forEach((workerDoc) => {

          if (workerDoc.id === workerId) {

            selectedWorker = {

              id: workerDoc.id,

              ...workerDoc.data()

            };

          }

        });


        if (!selectedWorker) {

          alert(
            "Worker नहीं मिला।"
          );

          return;

        }


        // ========================================
        // पूरी booking worker के साथ assign
        // ========================================

        await updateDoc(
          bookingRef,
          {

            assignedWorkerId:
              workerId,

            assignedWorkerName:
              selectedWorker.name || "",

            assignedWorkerMobile:
              selectedWorker.mobile || "",

            workerStatus:
              "Assigned",

            workStatus:
              "Assigned",

            status:
              "Worker Assigned",

            adminStatus:
              "Accepted",

            updatedAt:
              serverTimestamp()

          }
        );


        showMessage(
          "📤 Booking Worker को भेज दी गई!"
        );


        loadBookings();


      } catch (error) {

        console.error(error);

        showMessage(
          "Worker को booking भेजने में समस्या: " +
          error.message,
          "error"
        );

      }

    };


    // ============================================
    // REFRESH
    // ============================================

    refreshBtn.addEventListener(
      "click",
      loadBookings
    );


    // ============================================
    // FIRST LOAD
    // ============================================

    loadBookings();

  </script>

</body>
</html>
